name: Bundle to Single HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SingleFile CLI
        run: npm install -g single-file-cli

      - name: Bundle HTML and Assets
        run: |
          mkdir -p dist
          # Fix: Use --filename to specify the destination output file explicitly
          single-file index.html --filename=dist/cookie-clicker-single.html --browser-arg="--no-sandbox"

      - name: Commit and Push Bundled File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Only attempt git add if the file actually generated
          if [ -f "dist/cookie-clicker-single.html" ]; then
            git add dist/cookie-clicker-single.html
            
            if git diff --staged --quiet; then
              echo "No changes detected in bundle."
            else
              git commit -m "build: generate standalone single-file HTML"
              git push origin ${{ github.ref_name }}
            fi
          else
            echo "Error: Bundled file was not created by single-file CLI."
            exit 1
          fi

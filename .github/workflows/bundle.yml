name: Bundle to Single HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Install Chromium & SingleFile
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          npm install -g single-file-cli

      - name: Bundle HTML and Assets
        run: |
          mkdir -p dist
          # Run single-file pointing directly to the installed chromium binary
          single-file index.html --filename=dist/cookie-clicker-single.html \
            --browser-executable-path=/usr/bin/chromium-browser \
            --browser-arg="--no-sandbox" \
            --browser-arg="--disable-setuid-sandbox"

      - name: Commit and Push Bundled File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "dist/cookie-clicker-single.html" ]; then
            git add dist/cookie-clicker-single.html
            
            if git diff --staged --quiet; then
              echo "No changes detected in bundle."
            else
              git commit -m "build: generate standalone single-file HTML"
              git push origin ${{ github.ref_name }}
            fi
          else
            echo "Error: Bundled file was not created by single-file CLI."[cite: 2]
            exit 1
          fi

name: Bundle to Single HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          # Fetch full history and checkout the current branch (fixes detached HEAD / exit code 128)
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SingleFile CLI
        run: npm install -g single-file-cli

      - name: Bundle HTML and Assets
        run: |
          mkdir -p dist
          single-file index.html dist/cookie-clicker-single.html --browser-arg="--no-sandbox"

      - name: Commit and Push Bundled File
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dist/cookie-clicker-single.html
          
          if git diff --staged --quiet; then
            echo "No changes detected in bundle."
          else
            git commit -m "build: generate standalone single-file HTML"
            git push origin ${{ github.ref_name }}
          fi

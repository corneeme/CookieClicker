name: Bundle to Single HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'

      - name: Install SingleFile CLI
        run: npm install -g single-file-cli

      - name: Bundle HTML and Assets
        run: |
          # 1. Ensure the destination directory exists (Fixes Exit Code 128)
          mkdir -p dist

          # 2. Run single-file CLI with sandbox disabled for headless execution in Linux
          single-file index.html dist/cookie-clicker-single.html --browser-arg="--no-sandbox"

      - name: Commit Bundled File
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the dist folder explicitly
          git add dist/cookie-clicker-single.html
          
          if git diff --staged --quiet; then
            echo "No changes detected in bundle."
          else
            git commit -m "build: generate standalone single-file HTML"
            git push
          fi

name: Bundle HTML

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Single Playable HTML File
        run: |
          mkdir -p dist
          cat << 'EOF' > build_standalone.js
          const fs = require('fs');
          const path = require('path');

          let html = fs.readFileSync('index.html', 'utf8');

          // Inline style.css
          if (fs.existsSync('style.css')) {
            const css = fs.readFileSync('style.css', 'utf8');
            html = html.replace(/<link[^>]+href=["']style\.css["'][^>]*>/i, `<style>${css}</style>`);
          }

          // Inline main.js
          if (fs.existsSync('main.js')) {
            const js = fs.readFileSync('main.js', 'utf8');
            html = html.replace(/<script[^>]+src=["']main\.js["'][^>]*><\/script>/i, `<script>${js}</script>`);
          }

          // Point remote missing assets back to Orteil's live server so images/sounds don't 404 locally
          html = html.replace(/<head>/i, '<head><base href="https://orteil.dashnet.org/cookieclicker/">');

          fs.writeFileSync('dist/cookie-clicker-standalone.html', html);
          console.log('Successfully generated standalone HTML file!');
          EOF

          node build_standalone.js

      - name: Commit and Push Standalone HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -f "dist/cookie-clicker-standalone.html" ]; then
            git add dist/cookie-clicker-standalone.html
            
            if git diff --staged --quiet; then
              echo "No changes detected in build."
            else
              git commit -m "build: generate playable standalone html"
              git push origin ${{ github.ref_name }}
            fi
          else
            echo "Error: Output file was not generated."
            exit 1
          fi
